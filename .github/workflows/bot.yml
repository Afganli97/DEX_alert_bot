name: DEX Alerts Bot

env:
  ACTIONS_STEP_DEBUG: true

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Restore prices cache
        uses: actions/cache@v3
        with:
          path: prices.json
          key: prices-cache

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Run bot check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |

          echo "================================="
          echo "STARTING DEX ALERTS BOT"
          echo "================================="

          echo ""
          echo "Node version:"
          node -v

          echo ""
          echo "Checking environment variables..."

          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "ERROR: TELEGRAM_TOKEN is EMPTY"
            exit 1
          else
            echo "TELEGRAM_TOKEN exists"
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID is EMPTY"
            exit 1
          else
            echo "CHAT_ID exists"
          fi

          echo ""
          echo "Starting bot execution..."

          node index.js 2>&1 | tee output.log

          echo ""
          echo "Bot execution finished"

        timeout-minutes: 3

      - name: Upload bot logs
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: output.log

      - name: Save prices cache
        uses: actions/cache@v3
        with:
          path: prices.json
          key: prices-cache