name: DEX Alerts Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Restore prices cache
        uses: actions/cache@v3
        with:
          path: prices.json
          key: prices-cache

      - name: Install dependencies
        run: npm install

      - name: Run bot check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node index.js
        timeout-minutes: 3

      - name: Save prices cache
        uses: actions/cache@v3
        with:
          path: prices.json
          key: prices-cache
